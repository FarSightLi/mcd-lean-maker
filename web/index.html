<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麦麦减卡计算器</title>
<style>
:root{
  --red:#DA291C;--yellow:#FFC72C;--ink:#27251F;--muted:#6F6F6F;--bg:#F7F7F7;--card:#FFFFFF;
  --radius:16px;--shadow:0 2px 10px rgba(0,0,0,.08);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent;}
main{max-width:720px;margin:0 auto;padding:0 12px 32px;}

.topbar{
  background:var(--red);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.topbar strong{font-weight:800;font-size:18px;}
.topbar small{font-size:12px;opacity:.85;font-weight:400;}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;background:var(--card);border:1px solid #E7E5E1;color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;
  white-space:nowrap;
}
.chip.active{background:var(--red);border-color:var(--red);color:#fff;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;cursor:pointer;border:0;text-align:left;padding:0;display:block;width:100%;
  font-family:inherit;color:inherit;
}
.card .thumb{
  width:100%;aspect-ratio:1/1;background:#F0EEEA;display:flex;align-items:center;
  justify-content:center;overflow:hidden;position:relative;
}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.card .thumb .ph{color:var(--muted);font-size:12px;}
.card .tag{
  position:absolute;top:6px;left:6px;background:var(--yellow);color:var(--ink);
  font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;
}
.card .info{padding:10px 10px 12px;}
.card .name{font-size:14px;font-weight:700;margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.card .price{font-size:15px;font-weight:800;color:var(--red);margin:0;}
.card .price .orig{font-size:11px;color:var(--muted);font-weight:400;text-decoration:line-through;margin-left:4px;}

.sheet-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;
}
.panel{
  position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
  border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);
  max-height:86vh;overflow-y:auto;padding:16px 16px 24px;
}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.panel-head h2{margin:0;font-size:18px;font-weight:800;}
.panel-close{
  background:#F0EEEA;border:0;border-radius:50%;width:30px;height:30px;font-size:16px;
  color:var(--muted);cursor:pointer;flex:0 0 auto;
}

#calc-rounds{margin-top:12px;display:flex;flex-direction:column;gap:10px;}
.round-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.round-row select{
  width:100%;padding:10px;border-radius:10px;border:1px solid #E7E5E1;background:#fff;
  font-size:14px;color:var(--ink);
}

#calc-mods{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:0;}
#calc-mods li{
  display:flex;align-items:center;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid #F0EEEA;
}
#calc-mods li:last-child{border-bottom:0;}
.mod-label{display:flex;align-items:center;gap:10px;font-size:14px;}
.mod-kcal{font-size:12px;color:var(--muted);}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 auto;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.switch .track{
  position:absolute;inset:0;background:#E7E5E1;border-radius:999px;transition:background .15s;
}
.switch .track::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s;
}
.switch input:checked + .track{background:var(--red);}
.switch input:checked + .track::after{transform:translateX(18px);}
.switch input:focus-visible + .track{outline:2px solid var(--red);outline-offset:2px;}

.kcal-bar{margin-top:16px;display:flex;align-items:baseline;gap:8px;}
.kcal-bar b{font-size:34px;font-weight:800;color:var(--ink);}
.kcal-bar span{font-size:13px;color:var(--muted);}
#calc-equiv{font-size:13px;color:var(--red);font-weight:600;margin:6px 0 0;min-height:1.4em;}
#calc-macro{font-size:12px;color:var(--muted);margin:8px 0 0;}
#calc-price{font-size:14px;margin:10px 0 0;font-weight:600;}

.btn-primary{
  background:var(--yellow);color:var(--ink);border:0;border-radius:999px;font-weight:700;
  padding:12px 20px;font-size:14px;cursor:pointer;margin-top:14px;width:100%;
}

.empty-note{color:var(--muted);font-size:13px;padding:12px 0;}

h2.sec-title{font-size:17px;font-weight:800;margin:24px 0 12px;}

.sliders{display:flex;flex-direction:column;gap:14px;}
.slider-row label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px;}
.slider-row label .val{color:var(--red);}
.slider-row input[type=range]{
  width:100%;height:28px;background:transparent;-webkit-appearance:none;appearance:none;margin:0;
}
.slider-row input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:999px;background:#E7E5E1;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--red);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);margin-top:-8px;
}
.slider-row input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:#E7E5E1;}
.slider-row input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--red);border:3px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}

.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px;}
.plan-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;
  display:flex;flex-direction:column;gap:6px;position:relative;
}
.plan-card .plan-label{
  display:inline-block;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:800;
  border-radius:999px;padding:2px 10px;align-self:flex-start;
}
.plan-card .plan-items{font-size:13px;font-weight:700;margin:4px 0 0;line-height:1.4;}
.plan-card .plan-removed{font-size:12px;color:var(--muted);margin:0;}
.plan-card .plan-price{font-size:16px;font-weight:800;color:var(--red);margin:4px 0 0;}
.plan-card .plan-gold{font-size:12px;color:var(--muted);margin:0;}
.plan-card .plan-kcal{font-size:13px;margin:0;}
.plan-card .plan-protein{font-size:12px;color:var(--muted);margin:0;}
.badge-conf{
  position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;color:var(--muted);
  background:#F0EEEA;border-radius:999px;padding:2px 8px;
}

.new-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;}
.new-card .kcal-tag{font-size:12px;color:var(--muted);margin:2px 0 0;}

.share-box{margin-top:14px;}
#share-img{max-width:100%;border-radius:var(--radius);box-shadow:var(--shadow);display:block;margin-top:14px;}

.truth-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;}
.truth-table th,.truth-table td{text-align:left;padding:8px 6px;border-bottom:1px solid #E7E5E1;}
.truth-table th{color:var(--muted);font-weight:600;font-size:12px;}
.truth-note{font-size:12px;color:var(--muted);margin:10px 0 0;}

footer{
  text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 32px;
}

[hidden]{display:none !important;}
</style>
</head>
<body>
<header class="topbar">
  <strong>麦麦减卡计算器</strong>
  <small>非官方 · 基于麦当劳 MCP 的参赛作品</small>
</header>
<main>
  <section id="calc">
    <div class="chips" id="cat-chips"></div>
    <div class="grid" id="product-grid"></div>
  </section>
  <section id="plan">
    <h2 class="sec-title">预算 × 热量 推荐方案</h2>
    <div class="sliders">
      <div class="slider-row">
        <label for="plan-budget">预算 <span class="val" id="plan-budget-val"></span></label>
        <input type="range" id="plan-budget" min="1000" max="8000" step="100" value="3000">
      </div>
      <div class="slider-row">
        <label for="plan-cap">热量上限 <span class="val" id="plan-cap-val"></span></label>
        <input type="range" id="plan-cap" min="200" max="1500" step="10" value="700">
      </div>
    </div>
    <div class="plan-grid" id="plan-cards"></div>
  </section>
  <section id="new">
    <h2 class="sec-title">今日新品</h2>
    <div class="new-grid" id="new-cards"></div>
  </section>
  <section id="share">
    <h2 class="sec-title">生成分享卡</h2>
    <div class="share-box">
      <button type="button" class="btn-primary" id="share-btn">生成我的减卡卡片</button>
      <p class="empty-note" id="share-hint" hidden>请先在上方选一个商品算一算，再回到这里生成卡片</p>
      <canvas id="share-canvas" width="1080" height="1350" hidden></canvas>
      <img id="share-img" alt="减卡分享卡" hidden>
    </div>
  </section>
  <section id="truth">
    <h2 class="sec-title">数据从哪来</h2>
    <table class="truth-table">
      <thead><tr><th>置信度</th><th>来源</th></tr></thead>
      <tbody>
        <tr><td>官方</td><td>麦当劳营养成分表原值（MCP list-nutrition-foods）</td></tr>
        <tr><td>高 / 中</td><td>特制项与新品估算：A. 营养表同款成对相减；B. 海外官方数据校准</td></tr>
        <tr><td>低</td><td>同类食材估算，仅供参考</td></tr>
      </tbody>
    </table>
    <p class="truth-note" id="truth-snapshot"></p>
    <p class="truth-note">价格为快照门店当时价格，实际请以下单核价为准。</p>
    <p class="truth-note">想用实时数据和下单？请查看本项目仓库 README 中的「Skill 安装」说明。</p>
  </section>
</main>
<div class="sheet-overlay" id="calc-overlay" hidden></div>
<div class="panel" id="calc-panel" hidden role="dialog" aria-labelledby="calc-name" aria-modal="true">
  <div class="panel-head">
    <h2 id="calc-name"></h2>
    <button type="button" class="panel-close" id="calc-close" aria-label="关闭">×</button>
  </div>
  <div id="calc-rounds"></div>
  <ul id="calc-mods"></ul>
  <div class="kcal-bar"><b id="calc-kcal"></b><span id="calc-range"></span></div>
  <p id="calc-equiv"></p>
  <p id="calc-macro"></p>
  <p id="calc-price"></p>
</div>
<footer>非官方 · 基于麦当劳 MCP 的参赛作品 · 数据快照 <span id="snap-at"></span></footer>
<script>
const state = {items:null, rec:null, meta:null, current:null};
const fen = n => '¥' + (n/100).toFixed(2).replace(/\.?0+$/, '');
const EQUIV = [['圆筒冰淇淋',93],['小薯条',210],['可乐中杯',147]];

async function boot(){
  let items, rec, meta;
  try {
    [items, rec, meta] = await Promise.all(['items','recommend','meta']
      .map(n => fetch(`data/${n}.json`).then(r => {
        if (!r.ok) throw new Error(`${n} ${r.status}`);
        return r.json();
      })));
  } catch (err) {
    const calc = document.getElementById('calc');
    calc.innerHTML = '<p class="empty-note">数据加载失败，请刷新重试</p>';
    return;
  }
  Object.assign(state, {items, rec, meta});
  document.getElementById('snap-at').textContent = `${meta.storeName} ${meta.snapshotAt}`;
  renderChips(); renderGrid(); renderPlan(); renderNew(); renderTruth();
  bindPanelClose(); bindPlanSliders(); bindShare();
}

function resultOf(code, mask){ const it = state.items[code]; return it && it.results ? it.results[String(mask)] : null; }

function comboTotal(){
  const c = state.current, it = state.items[c.code];
  const parts = it.isCombo
    ? it.rounds.map((r, i) => [c.choices[i], c.choiceMasks[i] || 0])
    : [[c.code, c.mask]];
  const t = {kcal:0, low:0, high:0, protein:0, confidence:'官方', missing:[], adjusted:true};
  const rank = {'官方':3,'高':2,'中':1,'低':0};
  for (const [code, mask] of parts){
    const r = resultOf(code, mask);
    if (!r){ t.missing.push(state.items[code]?.name || code); continue; }
    for (const k of ['kcal','low','high','protein']) t[k] += r[k];
    if (rank[r.confidence] < rank[t.confidence]) t.confidence = r.confidence;
    t.adjusted = t.adjusted && r.adjusted;
  }
  return t;
}

function equivText(saved){
  if (saved < 30) return '';
  const [name, k] = EQUIV.find(([, k]) => saved >= k * 0.8) || EQUIV[0];
  return `省下 ${Math.round(saved)} kcal ≈ ${(saved / k).toFixed(1)} 份${name}`;
}

function allCategories(){
  const set = new Set();
  for (const it of Object.values(state.items)){
    if (it.choiceOnly) continue;
    for (const c of it.categories || []) set.add(c);
  }
  return Array.from(set);
}

let activeCat = null;

function renderChips(){
  const box = document.getElementById('cat-chips');
  box.innerHTML = '';
  const cats = ['全部', ...allCategories()];
  for (const cat of cats){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + ((cat === '全部' && !activeCat) || cat === activeCat ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', () => { activeCat = cat === '全部' ? null : cat; renderChips(); renderGrid(); });
    box.appendChild(btn);
  }
}

function renderGrid(){
  const box = document.getElementById('product-grid');
  box.innerHTML = '';
  for (const [code, it] of Object.entries(state.items)){
    if (it.choiceOnly) continue;
    if (activeCat && !(it.categories || []).includes(activeCat)) continue;
    box.appendChild(buildCard(code, it));
  }
}

function buildCard(code, it){
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (it.image){
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = it.name;
    img.src = it.image;
    img.onerror = () => { img.remove(); const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = '暂无图片'; thumb.appendChild(ph); };
    thumb.appendChild(img);
  } else {
    const ph = document.createElement('span');
    ph.className = 'ph';
    ph.textContent = '暂无图片';
    thumb.appendChild(ph);
  }
  if (it.isNew){
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = '上新';
    thumb.appendChild(tag);
  }
  card.appendChild(thumb);

  const info = document.createElement('div');
  info.className = 'info';
  const name = document.createElement('p');
  name.className = 'name';
  name.textContent = it.name;
  info.appendChild(name);
  const price = document.createElement('p');
  price.className = 'price';
  price.textContent = fen(it.priceFen);
  if (it.originalFen && it.originalFen > it.priceFen){
    const orig = document.createElement('span');
    orig.className = 'orig';
    orig.textContent = fen(it.originalFen);
    price.appendChild(orig);
  }
  info.appendChild(price);
  card.appendChild(info);

  card.addEventListener('click', () => openCalc(code));
  return card;
}

function openCalc(code){
  const it = state.items[code];
  const choices = {};
  const choiceMasks = {};
  if (it.isCombo){
    it.rounds.forEach((r, i) => {
      const def = r.choices.find(c => c.isDefault) || r.choices[0];
      choices[i] = def ? def.code : null;
      choiceMasks[i] = 0;
    });
  }
  state.current = {code, mask: 0, choices, choiceMasks};
  document.getElementById('calc-name').textContent = it.name;
  renderCalc();
  document.getElementById('calc-overlay').hidden = false;
  document.getElementById('calc-panel').hidden = false;
}

function closeCalc(){
  document.getElementById('calc-overlay').hidden = true;
  document.getElementById('calc-panel').hidden = true;
  state.current = null;
}

function bindPanelClose(){
  document.getElementById('calc-close').addEventListener('click', closeCalc);
  document.getElementById('calc-overlay').addEventListener('click', closeCalc);
}

function renderCalc(){
  const c = state.current;
  const it = state.items[c.code];
  renderRounds(it, c);
  renderMods(it, c);
  renderKcal(it, c);
  renderPrice(it, c);
}

function renderRounds(it, c){
  const box = document.getElementById('calc-rounds');
  box.innerHTML = '';
  if (!it.isCombo) return;
  it.rounds.forEach((round, i) => {
    const row = document.createElement('div');
    row.className = 'round-row';
    const label = document.createElement('label');
    label.setAttribute('for', `round-${i}`);
    label.textContent = round.name;
    row.appendChild(label);
    const select = document.createElement('select');
    select.id = `round-${i}`;
    for (const choice of round.choices){
      const opt = document.createElement('option');
      opt.value = choice.code;
      const choiceItem = state.items[choice.code];
      const diffText = choice.diffFen ? ` (${choice.diffFen > 0 ? '+' : ''}${fen(choice.diffFen)})` : '';
      opt.textContent = (choiceItem ? choiceItem.name : choice.code) + diffText;
      if (choice.code === c.choices[i]) opt.selected = true;
      select.appendChild(opt);
    }
    select.addEventListener('change', () => {
      c.choices[i] = select.value;
      c.choiceMasks[i] = 0;
      renderCalc();
    });
    row.appendChild(select);
    box.appendChild(row);
  });
}

function renderMods(it, c){
  const list = document.getElementById('calc-mods');
  list.innerHTML = '';
  const groups = it.isCombo
    ? it.rounds.map((r, i) => [c.choices[i], i]).filter(([code]) => code)
    : [[c.code, null]];

  for (const [code, roundIdx] of groups){
    const item = state.items[code];
    if (!item || !item.mods || item.mods.length === 0) continue;
    item.mods.forEach((mod, modIdx) => {
      const bit = 1 << modIdx;
      const li = document.createElement('li');
      const labelWrap = document.createElement('label');
      labelWrap.className = 'mod-label';
      const switchWrap = document.createElement('span');
      switchWrap.className = 'switch';
      const input = document.createElement('input');
      input.type = 'checkbox';
      const currentMask = roundIdx === null ? c.mask : (c.choiceMasks[roundIdx] || 0);
      input.checked = (currentMask & bit) !== 0;
      input.addEventListener('change', () => {
        const nextMask = (roundIdx === null ? c.mask : (c.choiceMasks[roundIdx] || 0)) ^ bit;
        if (roundIdx === null) c.mask = nextMask; else c.choiceMasks[roundIdx] = nextMask;
        renderCalc();
      });
      const track = document.createElement('span');
      track.className = 'track';
      switchWrap.appendChild(input);
      switchWrap.appendChild(track);
      const isLow = mod.confidence === '低';
      const textWrap = document.createElement('span');
      textWrap.textContent = mod.name + (isLow ? '(估)' : '');
      labelWrap.appendChild(switchWrap);
      labelWrap.appendChild(textWrap);
      li.appendChild(labelWrap);
      const kcalSpan = document.createElement('span');
      kcalSpan.className = 'mod-kcal';
      kcalSpan.textContent = `−${mod.kcal} kcal${isLow ? '' : '(估)'}`;
      li.appendChild(kcalSpan);
      list.appendChild(li);
    });
  }

  if (list.children.length === 0){
    const note = document.createElement('p');
    note.className = 'empty-note';
    note.textContent = '该商品暂无可去配料选项';
    list.appendChild(note);
  }
}

function renderKcal(it, c){
  const kcalEl = document.getElementById('calc-kcal');
  const rangeEl = document.getElementById('calc-range');
  const equivEl = document.getElementById('calc-equiv');
  const macroEl = document.getElementById('calc-macro');

  const total = comboTotal();
  if (total.missing.length > 0 && total.kcal === 0){
    kcalEl.textContent = '暂无营养数据';
    rangeEl.textContent = '';
    equivEl.textContent = '';
    macroEl.textContent = total.missing.length ? `缺失:${total.missing.join('、')}` : '';
    return;
  }

  kcalEl.textContent = `${Math.round(total.kcal)} kcal`;
  rangeEl.textContent = (total.low !== total.high) ? `(${Math.round(total.low)}–${Math.round(total.high)})` : '';

  const baseline = baselineTotal(it, c);
  const saved = baseline ? baseline.kcal - total.kcal : 0;
  equivEl.textContent = equivText(saved);

  let macroText = `蛋白质 ${Math.round(total.protein)}g`;
  if (!total.adjusted) macroText += '（未扣除特制部分，供参考）';
  if (total.missing.length) macroText += ` · 缺失:${total.missing.join('、')}`;
  macroEl.textContent = macroText;
}

function baselineTotal(it, c){
  const parts = it.isCombo
    ? it.rounds.map((r, i) => [c.choices[i], 0])
    : [[c.code, 0]];
  let kcal = 0;
  let ok = true;
  for (const [code, mask] of parts){
    const r = resultOf(code, mask);
    if (!r){ ok = false; continue; }
    kcal += r.kcal;
  }
  return ok ? {kcal} : null;
}

function renderPrice(it, c){
  const priceEl = document.getElementById('calc-price');
  let priceFen = it.priceFen;
  if (it.isCombo){
    it.rounds.forEach((round, i) => {
      const choice = round.choices.find(ch => ch.code === c.choices[i]);
      if (choice) priceFen += choice.diffFen || 0;
    });
  }
  let text = `现价 ${fen(priceFen)}`;
  if (it.originalFen && it.originalFen > it.priceFen) text += ` · 原价 ${fen(it.originalFen)}`;
  if (it.gold){
    const goldNet = it.gold.priceFen + it.gold.feeFen;
    const diff = priceFen - goldNet;
    const verdict = diff > 0 ? `开卡省${fen(diff)}` : `开卡更贵${fen(-diff)}`;
    text += ` · 麦金卡净价 ${fen(goldNet)}（${verdict}）`;
  }
  priceEl.textContent = text;
}

function bindPlanSliders(){
  const budget = document.getElementById('plan-budget');
  const cap = document.getElementById('plan-cap');
  budget.addEventListener('input', renderPlan);
  cap.addEventListener('input', renderPlan);
}

function renderPlan(){
  const budget = document.getElementById('plan-budget');
  const cap = document.getElementById('plan-cap');
  document.getElementById('plan-budget-val').textContent = fen(+budget.value);
  document.getElementById('plan-cap-val').textContent = `≤ ${cap.value} kcal`;

  const b = +budget.value, c = +cap.value;
  const idx = (state.rec.grid[`${b}_${c}`] || []);
  const labels = ['最省钱', '最低卡', '高蛋白'];
  const box = document.getElementById('plan-cards');
  box.innerHTML = idx.length
    ? idx.map((i, n) => planCard(labels[n], state.rec.bundles[i])).join('')
    : '<p class="empty-note">这个预算和热量下找不到组合，试试放宽一点</p>';
}

function planCard(label, bundle){
  const names = bundle.items.map(it => {
    const removedText = it.removed && it.removed.length ? `（去：${it.removed.join('、')}）` : '';
    return it.name + removedText;
  }).join(' + ');
  const kcalRange = bundle.low !== bundle.high ? `（${Math.round(bundle.low)}–${Math.round(bundle.high)}）` : '';
  let goldHtml = '';
  if (bundle.gold){
    const goldNet = bundle.gold.goldFen;
    goldHtml = `<p class="plan-gold">麦金卡净价 ${fen(goldNet)} · ${bundle.gold.verdict}</p>`;
  }
  return `<div class="plan-card">
    <span class="plan-label">${label}</span>
    <span class="badge-conf">${bundle.confidence}</span>
    <p class="plan-items">${names}</p>
    <p class="plan-price">${fen(bundle.priceFen)}</p>
    ${goldHtml}
    <p class="plan-kcal">${Math.round(bundle.kcal)} kcal${kcalRange}</p>
    <p class="plan-protein">蛋白质 ${Math.round(bundle.protein)}g</p>
  </div>`;
}

function renderNew(){
  const box = document.getElementById('new-cards');
  box.innerHTML = '';
  const entries = Object.entries(state.items).filter(([, it]) => it.isNew && !it.choiceOnly);
  if (entries.length === 0){
    box.innerHTML = '<p class="empty-note">暂无新品</p>';
    return;
  }
  for (const [code, it] of entries) box.appendChild(buildNewCard(code, it));
}

function buildNewCard(code, it){
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card new-card';

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (it.image){
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = it.name;
    img.src = it.image;
    img.onerror = () => { img.remove(); const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = '暂无图片'; thumb.appendChild(ph); };
    thumb.appendChild(img);
  } else {
    const ph = document.createElement('span');
    ph.className = 'ph';
    ph.textContent = '暂无图片';
    thumb.appendChild(ph);
  }
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = '上新';
  thumb.appendChild(tag);
  card.appendChild(thumb);

  const info = document.createElement('div');
  info.className = 'info';
  const name = document.createElement('p');
  name.className = 'name';
  name.textContent = it.name;
  info.appendChild(name);
  const price = document.createElement('p');
  price.className = 'price';
  price.textContent = fen(it.priceFen);
  info.appendChild(price);
  const r0 = it.results ? it.results['0'] : null;
  const kcalTag = document.createElement('p');
  kcalTag.className = 'kcal-tag';
  if (r0){
    kcalTag.textContent = `${Math.round(r0.kcal)} kcal${r0.confidence !== '官方' ? '（估算）' : ''}`;
  } else {
    kcalTag.textContent = '营养数据待补充';
  }
  info.appendChild(kcalTag);
  card.appendChild(info);

  card.addEventListener('click', () => {
    openCalc(code);
    document.getElementById('calc').scrollIntoView({behavior: 'smooth'});
  });
  return card;
}

function bindShare(){
  document.getElementById('share-btn').addEventListener('click', generateShareCard);
}

function generateShareCard(){
  const hint = document.getElementById('share-hint');
  if (!state.current){
    hint.hidden = false;
    return;
  }
  hint.hidden = true;

  const c = state.current, it = state.items[c.code];
  const total = comboTotal();
  const baseline = baselineTotal(it, c);
  const saved = baseline ? baseline.kcal - total.kcal : 0;

  const removedNames = [];
  const groups = it.isCombo
    ? it.rounds.map((r, i) => [c.choices[i], i])
    : [[c.code, null]];
  for (const [code, roundIdx] of groups){
    const item = state.items[code];
    if (!item || !item.mods) continue;
    const mask = roundIdx === null ? c.mask : (c.choiceMasks[roundIdx] || 0);
    item.mods.forEach((mod, modIdx) => {
      if (mask & (1 << modIdx)) removedNames.push(mod.name);
    });
  }

  let priceFen = it.priceFen;
  if (it.isCombo){
    it.rounds.forEach((round, i) => {
      const choice = round.choices.find(ch => ch.code === c.choices[i]);
      if (choice) priceFen += choice.diffFen || 0;
    });
  }

  const canvas = document.getElementById('share-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const font = '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';

  ctx.fillStyle = '#F7F7F7';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#DA291C';
  ctx.fillRect(0, 0, W, 160);
  ctx.fillStyle = '#fff';
  ctx.font = `800 44px ${font}`;
  ctx.fillText('麦麦减卡计算器', 60, 100);

  let y = 260;
  ctx.fillStyle = '#27251F';
  ctx.font = `700 48px ${font}`;
  wrapText(ctx, it.name, 60, y, W - 120, 58);
  y += 100;

  ctx.font = `800 72px ${font}`;
  ctx.fillStyle = baseline ? '#DA291C' : '#27251F';
  const kcalLine = baseline && baseline.kcal !== total.kcal
    ? `${Math.round(baseline.kcal)} → ${Math.round(total.kcal)} kcal`
    : `${Math.round(total.kcal)} kcal`;
  ctx.fillText(kcalLine, 60, y);
  y += 110;

  ctx.font = `400 36px ${font}`;
  ctx.fillStyle = '#6F6F6F';
  if (removedNames.length){
    y = wrapText(ctx, `去掉：${removedNames.join('、')}`, 60, y, W - 120, 46) + 46;
  }
  const equiv = equivText(saved);
  if (equiv) { ctx.fillText(equiv, 60, y); y += 60; }

  ctx.font = `700 44px ${font}`;
  ctx.fillStyle = '#DA291C';
  ctx.fillText(`现价 ${fen(priceFen)}`, 60, y);

  ctx.font = `400 28px ${font}`;
  ctx.fillStyle = '#6F6F6F';
  ctx.fillText('非官方 · 基于麦当劳 MCP 的参赛作品', 60, H - 60);

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const img = document.getElementById('share-img');
    img.src = url;
    img.hidden = false;

    const a = document.createElement('a');
    a.href = url;
    a.download = 'mcd-lite-calc.png';
    a.click();
  });
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  let line = '';
  for (const ch of text){
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, y);
      line = ch;
      y += lineHeight;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, y);
  return y;
}

function renderTruth(){
  document.getElementById('truth-snapshot').textContent = `快照门店：${state.meta.storeName} · 快照时间：${state.meta.snapshotAt}`;
}

boot();
</script>
